<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My neighborhood</title>
<style>
:root{--paper:#eee8de;--ink:#292621;--muted:#81786d;--line:#d5cdc0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:330px 1fr}.side{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.logo{font:30px Georgia,serif;letter-spacing:-.05em}.tag{font-size:11px;color:var(--muted);margin-top:5px}
.search{display:flex;border-bottom:1px solid #9b9287;padding:7px 0}.search input{border:0;outline:0;background:none;width:100%;font-size:15px}.search button{border:0;background:none;cursor:pointer;font-size:20px}
.status{font-size:11px;color:var(--muted);min-height:16px}.results{overflow:auto;display:grid;gap:6px;max-height:55vh}
.artist,.album{border:0;background:rgba(255,255,255,.18);padding:10px;text-align:left;cursor:pointer;color:var(--ink);border-bottom:1px solid rgba(150,140,125,.25)}
.artist:hover,.album:hover{background:rgba(255,255,255,.45)}.artist small,.album small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.back{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--muted);font-size:11px}
.note{margin-top:auto;font-size:9px;color:#9a9186;line-height:1.6}.main{padding:22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}.counter{font-size:10px;color:var(--muted);letter-spacing:.1em}.actions{display:flex;gap:7px}
.action{border:1px solid var(--line);background:rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;font-size:11px;cursor:pointer}
.wrap{flex:1;display:grid;place-items:center;padding:20px 0}#canvas{width:min(78vw,720px);aspect-ratio:1;position:relative;overflow:hidden;background:#e8e0d5;box-shadow:0 22px 70px rgba(55,45,35,.1)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c8378}.empty b{display:block;font:400 clamp(27px,4vw,46px) Georgia,serif;letter-spacing:-.04em}.empty span{font-size:9px;letter-spacing:.18em}
.cover{position:absolute;width:25%;aspect-ratio:1;object-fit:cover;border:5px solid #fbf8f2;box-shadow:0 9px 22px rgba(35,30,25,.2);cursor:pointer;animation:pop .35s ease both}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292621;color:white;border-radius:999px;padding:9px 14px;font-size:11px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:800px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--line);padding:18px}.results{max-height:170px}.note{display:none}.main{padding:12px}#canvas{width:94vw}}
</style></head><body>
<div class="app"><aside class="side">
<div><div class="logo">My neighborhood</div></div>
<form class="search" id="form"><input id="q" placeholder="artist name" autocomplete="off"><button>⌕</button></form>
<div id="status" class="status"></div><div id="results" class="results"></div>
<div id="note" class="note">album metadata — MusicBrainz<br>cover art — Cover Art Archive</div>
</aside>
<main class="main"><div class="top"><div id="counter" class="counter">0 albums</div><div class="actions"><button class="action" id="shuffle">shuffle</button><button class="action" id="clear">clear</button><button class="action" id="save">結果を保存</button><button class="action" id="postX">Xに投稿</button></div></div>
<div class="wrap"><div id="canvas"><div id="empty" class="empty"><div><b>my neighborhood</b><span>A LITTLE PLACE MADE OF MUSIC</span></div></div></div></div>
</main></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let covers=[],seed=0,view="artists";
function msg(x){let t=$("#toast");t.textContent=x;t.classList.add("show");clearTimeout(msg.t);msg.t=setTimeout(()=>t.classList.remove("show"),1700)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rnd(n,a,b){let x=Math.sin(n+seed*.71)*43758.5453;x-=Math.floor(x);return a+x*(b-a)}
function render(){document.querySelectorAll(".cover").forEach(x=>x.remove());covers.forEach((c,i)=>{let im=document.createElement("img");im.className="cover";im.src=c.image;im.alt=c.title;im.title=c.title;im.onclick=()=>{covers.splice(i,1);render()};im.style.left=rnd(i*7+1,7,68)+"%";im.style.top=rnd(i*11+3,7,68)+"%";im.style.transform=`rotate(${rnd(i*13+4,-14,14)}deg) scale(${rnd(i*17+2,.9,1.08)})`;im.style.zIndex=10+i;$("#canvas").appendChild(im)});$("#empty").style.display=covers.length?"none":"grid";$("#counter").textContent=`${covers.length} album${covers.length===1?"":"s"}`}
async function api(url){let r=await fetch(url);let d=await r.json();if(!r.ok)throw Error(d.error||"failed");return d}
async function search(q){$("#status").textContent="";$("#results").innerHTML="";try{let d=await api("/api/artists?q="+encodeURIComponent(q));if(!d.artists.length){$("#status").textContent="見つかりませんでした";return}view="artists";d.artists.forEach(a=>{let b=document.createElement("button");b.className="artist";b.innerHTML=`${esc(a.name)}<small>${esc(a.country||"")}</small>`;b.onclick=()=>albums(a);$("#results").appendChild(b)})}catch(e){$("#status").textContent=e.message}}
async function albums(a){$("#status").textContent="";$("#results").innerHTML=`<button class="back" id="back">← artists</button>`;$("#back").onclick=()=>search($("#q").value.trim());try{let d=await api("/api/albums?id="+a.id);if(!d.albums.length){$("#status").textContent="アルバムが見つかりませんでした";return}d.albums.slice(0,40).forEach(x=>{let b=document.createElement("button");b.className="album";b.innerHTML=`${esc(x.title)}<small>${esc(x.date)}</small>`;b.onclick=()=>add(x,b);$("#results").appendChild(b)})}catch(e){$("#status").textContent=e.message}}
async function add(a,b){if(covers.some(x=>x.id===a.id)){msg("もう入っています");return}b.disabled=true;try{let d=await api("/api/cover?id="+a.id);covers.push({id:a.id,title:a.title,image:d.image});seed++;render();msg("added")}catch(e){msg("ジャケットが見つかりませんでした")}b.disabled=false}
$("#form").onsubmit=e=>{e.preventDefault();let q=$("#q").value.trim();if(q)search(q)}
$("#clear").onclick=()=>{covers=[];seed++;render()};$("#shuffle").onclick=()=>{seed++;render()}
function waitImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function makeResultBlob(){
  if(!covers.length)throw Error("empty");
  const size=1600, c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=size;c.height=size;
  ctx.fillStyle="#e8e0d5";ctx.fillRect(0,0,size,size);
  const title="my neighborhood";
  ctx.fillStyle="#292621";ctx.font='52px Georgia, serif';ctx.fillText(title,70,92);
  for(let i=0;i<covers.length;i++){
    const item=covers[i],im=await waitImage(item.image),w=size*.25,h=w;
    const left=rnd(i*7+1,7,68)/100*size,top=rnd(i*11+3,7,68)/100*size;
    const rot=rnd(i*13+4,-14,14)*Math.PI/180,scale=rnd(i*17+2,.9,1.08),x=left+w/2,y=top+h/2;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);
    ctx.shadowColor="rgba(35,30,25,.20)";ctx.shadowBlur=28;ctx.shadowOffsetY=12;ctx.fillStyle="#fbf8f2";ctx.fillRect(-w/2-10,-h/2-10,w+20,h+20);ctx.shadowColor="transparent";ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
  }
  return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error("png")),"image/png"));
}
async function saveResult(){
  try{const blob=await makeResultBlob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="my-neighborhood.png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg("画像を保存しました")}catch(e){msg("画像を作れませんでした")}
}
async function postToX(){
  if(!covers.length)return msg("まずアルバムを追加してください");
  const text="#myneighb0rhood";
  try{
    const blob=await makeResultBlob();
    const file=new File([blob],"my-neighborhood.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text,title:"My neighborhood"});
      return;
    }
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="my-neighborhood.png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(text),"_blank","noopener");
    msg("画像を保存しました。Xで画像を添付してください");
  }catch(e){if(e.name!=="AbortError")msg("X投稿用の画像を作れませんでした")}
}
$("#save").onclick=saveResult;$("#postX").onclick=postToX;
render();
</script></body></html>
